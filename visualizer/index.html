<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sudoku Strict Swap Scan</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Strict raw cell swaps</p>
          <h1>Sudoku Swap Scan</h1>
        </div>
        <label class="source-picker">
          <span>Board</span>
          <select id="sourceSelect"></select>
        </label>
      </header>

      <section class="dashboard">
        <div class="board-panel">
          <div class="panel-heading">
            <h2 id="boardTitle">Board</h2>
            <p id="boardMeta">Current source board</p>
          </div>
          <div id="board" class="sudoku-board" aria-label="Current Sudoku board"></div>
        </div>

        <aside class="scan-panel">
          <section class="summary-grid" aria-label="Strict swap limits">
            <div>
              <span>Max Disjoint</span>
              <strong>40</strong>
            </div>
            <div>
              <span>Cells</span>
              <strong>81</strong>
            </div>
            <div>
              <span>Cell Pairs</span>
              <strong>3240</strong>
            </div>
            <div>
              <span>Effective Source Pairs</span>
              <strong>2916</strong>
            </div>
          </section>

          <section class="results-panel">
            <div class="panel-heading">
              <h2>Results</h2>
              <p id="frontierText">Computed strict depths</p>
            </div>
            <dl id="resultList" class="result-list"></dl>
          </section>

          <section class="depth-panel">
            <div class="panel-heading">
              <h2>Depth Progress</h2>
              <p>Shown from highest disjoint swap-set count down to one. Computed rows are labeled exact or guided.</p>
            </div>
            <div id="depthList" class="depth-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <script src="data/raw-cell-swap-depth-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
