<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sudoku Transformation Visualizer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Controls">
        <div class="title-block">
          <h1>Sudoku Transformation Visualizer</h1>
          <p id="summaryText">Arbitrary cell-swap transformations</p>
        </div>

        <section class="control-group" aria-label="View">
          <h2>View</h2>
          <div class="segmented vertical" data-control="view">
            <button class="active" type="button" data-view="arbitrary-transformations">Arbitrary Transforms</button>
            <button type="button" data-view="test-plan">Test Plan</button>
          </div>
        </section>

        <section class="control-group" aria-label="Batch jobs">
          <h2>Batch Jobs</h2>
          <div id="jobList" class="job-list" aria-live="polite"></div>
        </section>

        <section class="metrics" aria-label="Metrics">
          <h2>Metrics</h2>
          <dl id="metricsList"></dl>
        </section>
      </aside>

      <section class="workspace" aria-label="Visualization">
        <div class="viz-header">
          <div>
            <h2 id="viewTitle">Arbitrary Transforms</h2>
            <p id="viewSubtitle">Cell-swap endpoints classified after excluding standard Sudoku symmetries.</p>
          </div>
        </div>

        <div class="board-stage hidden">
          <svg id="edgeLayer" class="edge-layer" viewBox="0 0 760 760" aria-hidden="true"></svg>
          <div id="board" class="sudoku-board" aria-label="Sudoku board"></div>
        </div>
        <div id="dataPage" class="data-page hidden" aria-live="polite"></div>
      </section>
    </main>

    <script src="data/arbitrary-transformations-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
